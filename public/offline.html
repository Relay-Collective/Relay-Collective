<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f7">
  <title>You're offline · Relay Collective</title>
  <style>
    body { margin:0; color:#111820; background:#f8f9f7; font: 1rem/1.5 system-ui,sans-serif; }
    main { max-width:32rem; margin:auto; padding:calc(12vh + env(safe-area-inset-top)) 1.5rem 2rem; }
    h1 { line-height:1.15; }
    img { border-radius:1rem; }
    button { font:inherit; font-weight:700; border:0; color:white; background:#111820; border-radius:1rem; padding:.8rem 1.25rem; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/apple-touch-icon.png" width="64" height="64" alt="">
    <p>Relay Collective</p>
    <h1>You're offline</h1>
    <p>Reconnect to view your workspace or make changes to a ride.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
