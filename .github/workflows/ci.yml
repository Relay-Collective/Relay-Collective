name: Relay Collective CI

# Lint, unit tests (with coverage), type-check + production build, the PGlite
# database tests, and Playwright browser tests. Nothing here deploys: Cloudflare Workers Builds deploys
# main on its own (see docs/CI_CD.md). Pull-request code is untrusted, so this
# workflow uses no secrets and a read-only token.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's older run. Pushes to main and
# manual runs get their own group (run_id), so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        id: install
        run: npm ci

      # Lint, tests and build each run even if an earlier one failed, so one push
      # reports every problem. Any failure still fails the job.
      - name: Lint (ESLint)
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      # Same tests as `npm test`, plus the built-in Node coverage report.
      - name: Unit tests with coverage
        id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage

      # tsc -b checks both TypeScript projects, then Vite builds dist/.
      # No VITE_* variables are set, so this is the demo (mock) build.
      - name: Type-check and production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Write job summary
        if: ${{ !cancelled() }}
        env:
          INSTALL: ${{ steps.install.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Code quality"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Install dependencies | ${INSTALL} |"
            echo "| ESLint | ${LINT} |"
            echo "| Unit tests | ${UNIT} |"
            echo "| Type-check and build | ${BUILD} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/coverage-summary.mjs coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # Applies every file in supabase/migrations to an embedded Postgres
      # (PGlite) and tests access rules against it. No Supabase project is used.
      - name: Database tests (migrations and access rules)
        id: db
        run: npm run test:db

      - name: Write job summary
        if: ${{ !cancelled() }}
        env:
          DB: ${{ steps.db.outcome }}
        run: |
          {
            echo "## Database tests"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Migrations + access rules (PGlite) | ${DB:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (npm ci)
        id: install
        run: npm ci

      # Headless Chromium only (every test runs headless), plus the system libraries it needs.
      # The version comes from the @playwright/test pinned in package-lock.json.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # playwright.config.ts builds the app with the mock backend into dist-e2e/ and serves it on
      # 127.0.0.1. Every request outside that server is blocked, so no Supabase, maps or live APIs.
      - name: Browser tests (Playwright)
        id: e2e
        run: npm run test:e2e

      - name: Write job summary
        if: ${{ !cancelled() }}
        env:
          E2E: ${{ steps.e2e.outcome }}
        run: |
          {
            echo "## Browser tests"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Playwright (Chromium, mock backend) | ${E2E:-skipped} |"
            echo ""
            echo "The **playwright-report** artifact has the full HTML report."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      # Screenshots, plus the trace and video of the retry, for failed tests only
      - name: Upload failure screenshots and traces
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
